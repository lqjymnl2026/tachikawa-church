<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0B54E"/>
      <stop offset="1" stop-color="#E9A23B"/>
    </linearGradient>
  </defs>
  <!-- 外环 -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#2F5D4A" stroke-width="4"/>
  <!-- 太阳 -->
  <circle cx="60" cy="60" r="30" fill="url(#sun)" opacity="0.16"/>
  <circle cx="60" cy="60" r="22" fill="url(#sun)" opacity="0.5"/>
  <!-- 十字（留白镂空，与背景色一致） -->
  <g fill="#F7F4ED" stroke="none">
    <rect x="52" y="34" width="16" height="52" rx="8"/>
    <rect x="34" y="52" width="52" height="16" rx="8"/>
  </g>
  <!-- 十字描边 -->
  <g fill="none" stroke="#2F5D4A" stroke-width="3.5" stroke-linecap="round">
    <line x1="60" y1="36" x2="60" y2="84"/>
    <line x1="36" y1="60" x2="84" y2="60"/>
  </g>
</svg>
